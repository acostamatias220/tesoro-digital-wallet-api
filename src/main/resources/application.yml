# All secrets come from environment variables (see .env.example). Nothing sensitive lives here.
spring:
  application:
    name: tesoro
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tesoro}
    username: ${DB_USER:tesoro}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    generator:
      write-bigdecimal-as-plain: true
    serialization:
      write-dates-as-timestamps: false
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
      roles: ADMIN
  health:
    circuitbreakers:
      enabled: true
  metrics:
    tags:
      application: tesoro
  prometheus:
    metrics:
      export:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    persist-authorization: true

tesoro:
  security:
    jwt:
      secret: ${JWT_SECRET:}
      issuer: ${JWT_ISSUER:tesoro}
      access-token-ttl: ${ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${REFRESH_TOKEN_TTL:7d}
    bcrypt-strength: 12
  idempotency:
    ttl: 24h
  outbox:
    batch-size: 50
    max-attempts: 10
  fx:
    provider: ${FX_PROVIDER:mock}
    mock:
      bid: ${FX_MOCK_BID:1400.00}
      ask: ${FX_MOCK_ASK:1450.00}
    dolarapi:
      base-url: https://dolarapi.com
      path: /v1/dolares/oficial
      cache-ttl: 60s
      max-staleness: 30m
      connect-timeout: 2s
      read-timeout: 3s
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    auth-per-minute: 10
    operations-per-minute: 30
    default-per-minute: 300
  jobs:
    enabled: true
    reconciliation-cron: ${RECONCILIATION_CRON:0 */10 * * * *}
    outbox-delay-ms: 2000
    idempotency-cleanup-cron: "0 0 * * * *"
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  seed:
    enabled: ${SEED_DEMO_DATA:false}
    password: ${SEED_PASSWORD:}

resilience4j:
  circuitbreaker:
    instances:
      dolarApi:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 4
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
        register-health-indicator: true
  retry:
    instances:
      dolarApi:
        max-attempts: 2
        wait-duration: 300ms

logging:
  level:
    tesoro.events: INFO
