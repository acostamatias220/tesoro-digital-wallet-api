# Usage: cp .env.example .env  (fill in the values)  &&  docker compose up --build
# Optional Prometheus: docker compose --profile observability up --build
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tesoro
      POSTGRES_USER: ${DB_USER:-tesoro}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d tesoro"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/tesoro
      DB_USER: ${DB_USER:-tesoro}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-7d}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      FX_PROVIDER: ${FX_PROVIDER:-mock}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      SEED_PASSWORD: ${SEED_PASSWORD:-}
    ports:
      - "8080:8080"

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["observability"]
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - api

volumes:
  pgdata:
